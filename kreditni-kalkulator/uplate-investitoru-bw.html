<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Idejni plan uplata</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Jedna kolona, jedna tabela. Sistemski font (SF Pro na Apple uređajima), krupno i čitko. */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --ink:#1d1d1f; --ink2:#6e6e73; --line:#e5e5ea; --accent:#0a66d6;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --ink:#f5f5f7; --ink2:#a1a1a6; --line:#38383a; --accent:#4c9bff; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#000000; --surface:#1c1c1e; --ink:#f5f5f7; --ink2:#a1a1a6; --line:#38383a; --accent:#4c9bff; color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:19px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:620px;margin:0 auto;padding-block:56px 72px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1{font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin:0 0 28px;text-wrap:balance}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05)}
th{font-size:15px;font-weight:500;color:var(--ink2);text-align:left;padding:18px 24px 12px}
td{padding:17px 24px;border-top:1px solid var(--line)}
th:last-child,td:last-child{text-align:right;white-space:nowrap}
td:last-child{font-weight:600}
td.zero{color:var(--ink2);font-weight:400}
tr.total td{font-weight:700;font-size:21px;padding-block:20px}
tr.bank td{background:color-mix(in srgb,var(--accent) 8%,var(--surface));padding-block:20px}
tr.bank td:first-child small{display:block;font-size:16px;color:var(--ink2);margin-top:2px}
tr.bank td:last-child{color:var(--accent);font-weight:700;font-size:21px;vertical-align:top}
@media (max-width:420px){ body{font-size:17px} h1{font-size:30px} td,th{padding-left:18px;padding-right:18px} tr.total td,tr.bank td:last-child{font-size:19px} }
@media print{ body{background:#fff;color:#000} .wrap{padding-block:0} table{box-shadow:none;border:1px solid #ccc} tr.bank td{background:#f2f2f2} }
</style>

<div class="wrap">
  <h1>Idejni plan uplata</h1>
  <table>
    <thead><tr><th>Mesec</th><th>Uplata</th></tr></thead>
    <tbody>
      <tr><td>Oktobar 2026</td><td>100.000 €</td></tr>
      <tr><td>Novembar 2026</td><td>2.945 €</td></tr>
      <tr><td>Decembar 2026</td><td>2.945 €</td></tr>
      <tr><td>Januar 2027</td><td class="zero">0 €</td></tr>
      <tr><td>Februar 2027</td><td>2.890 €</td></tr>
      <tr><td>Mart 2027</td><td>2.945 €</td></tr>
      <tr><td>April 2027</td><td>12.945 €</td></tr>
      <tr><td>Maj 2027</td><td>2.062 €</td></tr>
      <tr><td>Jun 2027</td><td class="zero">0 €</td></tr>
      <tr><td>Jul 2027</td><td>774 €</td></tr>
      <tr class="total"><td>Ukupno</td><td>127.505 €</td></tr>
      <tr class="bank"><td>Jul 2027<small>Banka isplaćuje ostatak</small></td><td>136.383 €</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
